<div class="container d-flex flex-column gap-3">
  <div class="d-flex justify-content-between align-items-center py-4">
    <div class="h4 mb-0">Products</div>

    <button
      class="btn btn-outline-info d-flex align-items-center"
      (click)="openModal('add')"
    >
      <i class="bi bi-plus-lg me-2"></i>
      Add Product
    </button>

    <button
      (click)="logout()"
      class="btn btn-outline-danger d-flex align-items-center"
    >
      <i class="bi bi-box-arrow-left me-2"></i>Logout
    </button>
  </div>

  <!-- Loader -->
  <!-- if data's not came we are showing loader -->
  <div
    *ngIf="loading"
    class="d-flex justify-content-center align-items-center py-5"
  >
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- table -->
  <div *ngIf="!loading" class="table-responsive">
    <table class="table table-bordered table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Product</th>
          <th>Description</th>
          <th>Image</th>
          <th>Link</th>
          <th>Status</th>
          <th>View</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of products">
          <th>{{ p.name }}</th>
          <th>{{p.description}}</th>
          <!-- <th>Image {{p.link}}</th> -->
          <th>
            <ng-container *ngIf="p.link; else noImage">
              <img
                [src]="p.link"
                alt="Product Image"
                class="img-thumbnail"
                style="width: 120px; height: 60px; object-fit: cover"
              />
            </ng-container>

            <ng-template #noImage>
              <div
                style="
                  width: 120px;
                  height: 60px;
                  background-color: #e0e0e0;
                  border-radius: 4px;
                "
              ></div>
            </ng-template>
          </th>

          <th>{{p.link}} <a href="{{p.link}}">link</a></th>
          <th>{{p.isActive ? "Active": "InActive"}}</th>
          <th>
            <button class="btn me-2" (click)="openModal('view', p)">
              <i class="bi bi-eye"></i>
            </button>
          </th>
          <th>
            <button class="btn me-2" (click)="openModal('edit', p)">
              <i class="bi bi-pen"></i>
            </button>
          </th>
          <th>
            <button class="btn me-2" (click)="deleteProduct(p)">
              <i class="bi bi-trash"></i>
            </button>
          </th>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Product Modal -->
<!-- we are sending mode of the form through this we will reuse -->
<app-product-modal
  [isOpen]="isModalOpen"
  (closed)="closeModal()"
  [mode]="modalMode"
  [product]="selectedProduct"
></app-product-modal>
