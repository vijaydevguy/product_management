<!-- product-modal.component.html -->
<div class="modal fade show d-block" tabindex="-1" *ngIf="isOpen" style="z-index: 1050;">
  <!-- Backdrop click closes modal -->
  <div class="modal-backdrop fade show" (click)="close()" style="z-index: 1040;"></div>

  <!-- body -->
  <div class="modal-dialog modal-lg modal-dialog-centered" style="z-index: 1055;">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Product</h5>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" formControlName="name" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea
              formControlName="description"
              class="form-control"
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Product Image</label>
            <input
              type="file"
              class="form-control"
              (change)="onFileSelected($event)"
            />
            <div *ngIf="imagePreview" class="mt-2">
              <img
                [src]="imagePreview"
                alt="Preview"
                class="img-thumbnail"
                width="100"
              />
            </div>
          </div>

          <div class="form-check form-switch mb-3">
            <input
              type="checkbox"
              class="form-check-input"
              formControlName="isActive"
            />
            <label class="form-check-label">Active</label>
          </div>

          <button class="btn btn-primary" type="submit">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>
